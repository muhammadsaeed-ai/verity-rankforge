name: Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Compile Python source
        run: python -m compileall -q rankforge tests
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = ("web/index.html", "web/monitoring.html")
          for page in pages:
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
              if not scripts:
                  raise SystemExit(f"No inline script found in {page}")
              output = Path("/tmp") / (Path(page).stem + ".js")
              output.write_text("\\n".join(scripts), encoding="utf-8")
              print(f"Extracted {len(scripts)} script(s) from {page} to {output}")
          PY
          node --check /tmp/index.js
          node --check /tmp/monitoring.js
      - name: Run regression and API tests
        run: python -m pytest
